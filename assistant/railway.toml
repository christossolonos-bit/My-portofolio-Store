[build]
builder = "NIXPACKS"
# Seeds Solonaras knowledge.json, then builds the Next guide API.
buildCommand = "npm run build"

[deploy]
# Railway injects PORT; next must listen on it (domain may target 8080).
startCommand = "npx next start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/api/config"
restartPolicyType = "ON_FAILURE"
