    />

  </head>
  <body>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('solonaras-layout')
          var phone =
            stored === 'phone' ||
            (stored !== 'desktop' &&
              window.matchMedia('(max-width: 720px)').matches)
          document.documentElement.classList.toggle('is-phone-layout', phone)
          document.documentElement.classList.toggle('is-desktop-layout', !phone)
          document.documentElement.dataset.layout = phone ? 'phone' : 'desktop'
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
